name: Shurik Ralph
run-name: Ralph ${{ inputs.loop_id }} / ${{ inputs.command }} ${{ inputs.generation }}-${{ inputs.iteration }}
on:
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [start, iterate]
        default: start
      loop_id:
        description: Unique lowercase loop ID
        required: true
        type: string
      model:
        description: Optional OpenCode Go model; blank uses project configuration
        type: string
      reasoning:
        description: Explicit model reasoning level (for example high)
        required: true
        type: string
      source_ref:
        description: Optional project branch or commit to start from
        type: string
      seconds:
        description: Optional iteration budget (10–1800 seconds)
        type: string
      deadline:
        description: Optional absolute deadline, for example 2026-10-12T12:00:00Z
        type: string
      generation:
        description: Internal continuation generation
        default: '1'
        type: string
      iteration:
        description: Internal continuation sequence
        default: '1'
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: shurik-worker-${{ inputs.loop_id }}
  cancel-in-progress: false
jobs:
  iteration:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: igor-makarov/shurik@v1
        with:
          inputs: ${{ toJSON(inputs) }}
          workflow: ralph.yml
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
      - name: Preserve emergency snapshot after publication failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shurik-emergency-${{ github.run_id }}
          path: .shurik-emergency/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
