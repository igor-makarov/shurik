name: Shurik Control
on:
  workflow_dispatch:
    inputs:
      command:
        required: true
        type: choice
        options: [stop, resume]
      loop_id:
        required: true
        type: string
      reasoning:
        description: Required for resume; no default
        type: string
      model:
        description: Optional replacement model on resume
        type: string
      deadline:
        description: Optional replacement absolute deadline on resume
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: shurik-control-${{ inputs.loop_id }}
  cancel-in-progress: false
jobs:
  control:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: igor-makarov/shurik@v1
        with:
          inputs: ${{ toJSON(inputs) }}
