name: Shurik Control
on:
  workflow_dispatch:
    inputs:
      command:
        required: true
        type: choice
        options: [stop, resume]
      loop_id:
        required: true
        type: string
      reasoning:
        description: Required when resuming; explicit level with no default
        type: string
      model:
        description: Optional new OpenCode Go model when resuming; blank keeps the existing model
        type: string
      deadline:
        description: Optional new absolute UTC deadline when resuming
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: shurik-control-${{ inputs.loop_id }}
  cancel-in-progress: false
jobs:
  control:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          SHURIK_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/supervisor.mjs
